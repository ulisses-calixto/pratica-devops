services:
  nginx:
    build: ./nginx
    container_name: devops_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - api

  front:
    build: ./frontend
    container_name: devops_front
    environment:
      - VITE_URL_API=/api 
    volumes:
      - ./frontend:/app
      - /app/node_modules

  db:
    image: postgres:17-alpine
    container_name: devops_postgres
    restart: always
    environment:
      POSTGRES_USER: admulisses
      POSTGRES_PASSWORD: ulisses123
      POSTGRES_DB: devops_db
    ports:
      - "5433:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: devops_api
    restart: always
    ports:
      - "2375:2375"
    environment:
      - API_EXTERNA=http://nginx/fakestore/products
      - DB_HOST=db
      - DB_USER=admulisses       
      - DB_PASSWORD=ulisses123   
      - DB_NAME=devops_db
      - DB_PORT=5432             
      - PORT=2375
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
  